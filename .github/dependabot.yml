version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/apps/scoreboard-api"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/apps/stats-service"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/apps/news-service"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/apps/scoreboard-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/stats-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/news-service"
    schedule:
      interval: "weekly"
